name: Counterpane
description: 'Counterpane Internet Security, Inc. was a managed security services provider founded by cryptographer
  Bruce Schneier, growing out of his Counterpane Systems cryptography consultancy. Counterpane pioneered
  Managed Security Monitoring (MSM) — outsourced, 24x7 human-staffed security operations centers that
  monitored customer networks and devices for intrusions, rather than selling security products. It was
  venture-backed, with Accel among its investors, and was acquired by BT Group in 2006, after which its
  operations were folded into BT''s managed security business. The company is defunct as an independent
  entity: it operates no product, developer portal, documentation, SDKs, or API surface today. As of the
  2026-07-20 enrichment probe, counterpane.com resolves (209.17.116.163, Network Solutions nameservers)
  but refuses HTTPS on port 443, and plain HTTP redirects to https://www.schneier.com/ — Bruce Schneier''s
  personal site. www.counterpane.com returns HTTP 404. There is no MX, SPF, DMARC, or CAA record on the
  domain. This profile is retained as a historical record; there is no API surface to enrich.'
